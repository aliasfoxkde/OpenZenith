# GitForge CI pipeline — local primary CI/CD (GitHub Actions is the mirror).
# Jobs mirror .github/workflows/ci.yml: api lint/typecheck/test, python
# lint/test, rust test. Deploy stays in GitHub Actions until GitForge gains a
# Cloudflare Pages deploy step.
name: openzenith-ci
version: "1.0"
trigger_on:
  - push
  - pull_request
environment: {}
jobs:
  api-lint:
    image: node:20
    timeout: 20m
    steps:
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working_directory: api
      - name: ESLint
        run: npm run lint
        working_directory: api
  api-typecheck:
    image: node:20
    timeout: 20m
    steps:
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working_directory: api
      - name: TypeScript
        run: npx tsc --noEmit
        working_directory: api
  api-test:
    image: node:20
    timeout: 30m
    steps:
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working_directory: api
      - name: Unit tests
        run: npm run test
        working_directory: api
  python-lint:
    image: python:3.13
    timeout: 15m
    steps:
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[all,dev]" ruff
      - name: Ruff
        run: ruff check openzenith/
  python-test:
    image: python:3.13
    timeout: 30m
    steps:
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[all,dev]"
      - name: Pytest
        run: pytest openzenith/tests/ -q --cov=openzenith --cov-fail-under=70 --cov-report=term-missing
  rust-test:
    image: rust:1.80
    timeout: 40m
    steps:
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path core/Cargo.toml
