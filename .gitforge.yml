# OpenZenith — GitForge CI pipeline (PRIMARY CI/CD platform).
#
# Schema notes that shape this file (from GitForge
# crates/gitforge-ci/src/pipeline.rs and services/ci/src/main.rs — there is
# no schema doc elsewhere; sibling pipelines StationAware/.gitforge.yml and
# kubix/.gitforge.yml document the same contract):
#   * Jobs of one run SHARE one workspace directory, so the graph must stay a
#     linear `needs` chain — parallel jobs would corrupt npm's locks/cache.
#   * `environment:` (top level) and `env:` at any level are REQUIRED-but-DEAD:
#     parsed, never forwarded to the container. Everything is set inline.
#   * `jobs[].retry` is parsed but never enforced — the unit-test job carries
#     its own in-command retry (NAS tinypool worker-start timeouts are
#     reported-but-fatal; one retry absorbs them without hiding anything).
#   * No `cache:`/`artifacts:`/`services:` keys exist. Images must already
#     exist on the runner host (60s sandbox-acquisition cap rules out pulls at
#     run time): `node:22-bookworm` is pre-pulled locally.
#   * Each step's log is capped at 64 KB (oldest bytes dropped), so chatty
#     steps redirect to a file and echo only the verdict lines.
#   * There is no secrets mechanism — this pipeline needs none (npm registry
#     only, no tokens in repo per repo policy).
#
# PLATFORM TOPOLOGY — fedora-docker is the single active runner (2026-10-10):
#   Per operator directive, CI executes on the fedora remote (192.168.1.202,
#   runner bdcc23ed via ~/bin/gitforge-runner-guard.sh), NOT on the shared
#   dev host — the swarmone runner agent (gitforge@runner.service) is stopped
#   and masked. The scheduler has no runner affinity (crates/gitforge-scheduler/
#   src/policy.rs SimplePolicy takes any online runner), so exactly ONE runner
#   may be online fleet-wide — the 2026-10-03 409 lease-supersede loop is the
#   two-runner failure mode.
#
# FEDORA TRANSPORT — sshfs bridge and the container-local materialization:
#   The runner bind-mounts its workspace through an sshfs bridge (container
#   `binds: <workspace>:/workspace:z`) whose sftp layer denies READLINK
#   ("Operation not permitted") and adds per-syscall latency to everything.
#   Two defects, two layers of fix:
#     1. Symlink exec: npm's node_modules/.bin symlinks are unexecutable over
#        that bridge — `npx tsc` fell back to the fake `tsc@2.0.4` package and
#        `npm run <script>` died with EPERM (runs ad2cdb2a/ffaa574a on commit
#        2418e2e; same signature as the 2026-10-05 "vitest: Operation not
#        permitted" faults). Fix: scripts/ci/relink-bins.mjs rebuilds .bin
#        entries as real-file shims (plain file IO). Retained in the repo for
#        any workspace-resident npm usage.
#     2. Throughput (2026-10-10, run 90ac36d0): `npm ci` wrote its ~940MB
#        node_modules through the bridge — 30 minutes was not enough under
#        co-tenant load. The pipeline now never puts node_modules on the
#        bridge at all: `install` copies api/ sources to container-local
#        /build, runs `npm ci` there (local overlay disk), and packs
#        node_modules + sources into ONE tar file in the shared workspace.
#        Every downstream job untars that single sequential file into its own
#        container-local /build and works from local disk. Bulk streaming
#        reads replace tens of thousands of small-file sftp round-trips.
#   Registry note: the aegis image is not pullable off-host (localhost:5000
#   is swarmone-loopback-only); fedora carries a docker-load copy — refresh
#   it with scripts/ci/build-ci-image.sh + `docker save | ssh fedora docker
#   load` whenever the image changes.
#
# Deliberately NOT in the pipeline (documented decisions):
#   * e2e (Playwright): the runner is this same shared NAS — load-band
#     timeouts make browser suites a lottery here (StationAware 2026-09-30:
#     failures only at load avg 50-73, all green at ~15). E2E stays a local
#     gate via scripts/ship.sh, which also owns deploy + prod verification.
#   * pages:build / pages:deploy: needs wrangler + Cloudflare auth and is the
#     flakiest step under box load; deploy stays a deliberate local act, not
#     an automatic one (a red build must never block a hotfix deploy, and a
#     green CI must never deploy unreviewed work). The bundle-budget job
#     DOES run pages:build (no deploy) as the perf tripwire.
#   * cargo test (core/), pytest (openzenith/): other-toolchain gates; run
#     locally (no rust/python image pre-pulled).
#   * 2026-10-06: aegis MOVED INTO the pipeline once its finding inventory
#     was fully triaged (docs/security/TRIAGE.md 2026-10-06 entry: 1,049
#     findings dispositioned, 0 true positives) and the gate was made
#     checkout-path independent (repo-relative fingerprints — before that
#     the baseline was bound to the dev host's absolute paths, which the
#     runner's /workspace mount can never reproduce). The job runs in the
#     localhost:5000/openzenith-ci-aegis:1 image (node:22-trixie + the aegis
#     binary baked in; the binary needs GLIBC_2.39 so bookworm is out), built
#     by scripts/ci/build-ci-image.sh and PUSHED to the GitForge local OCI
#     registry (127.0.0.1:5000): the runner's hardened service context
#     (User=gitforge, ProtectHome) cannot see images that exist only in a
#     developer's local docker store — the registry is the sharing path, and
#     images must be pushed there BEFORE a push references them.
name: openzenith-ci
version: "1.0"
trigger_on:
  - push
environment: {}
jobs:
  - name: aegis
    image: localhost:5000/openzenith-ci-aegis:1
    steps:
      # Security delta gate: fails only on findings whose fingerprint
      # (pattern + repo-relative path + line + content hash) is absent from
      # the committed baseline. Every accepted class has a reviewed
      # rationale in docs/security/TRIAGE.md — the baseline is regenerated
      # ONLY after triage, never to make this job green.
      - name: aegis delta gate
        run: ./scripts/aegis_scan.sh
    # Local full-scope scans run ~2-4m; headroom for shared-host load.
    timeout: 20m

  - name: install
    image: node:22-bookworm
    steps:
      - name: npm ci on container-local disk + pack deps tarball
        run: |
          set -e
          # Sources only — small enough to stream through the bridge cheaply.
          mkdir -p /build
          tar cf - -C /workspace api --exclude=api/node_modules | tar xf - -C /build
          cd /build/api
          npm ci > /tmp/install.log 2>&1 || { tail -40 /tmp/install.log; exit 1; }
          tail -3 /tmp/install.log
          # One big sequential file crosses the bridge fast; the 940MB of
          # node_modules never touch it as 50k small files.
          tar cf /workspace/api-deps.tar -C /build api
    needs: [aegis]
    # 2026-10-03/04: three consecutive infra-class install failures under
    # co-tenant load (2x infrastructure_failure with empty logs, 1x
    # timed_out at 15m — npm ci never finished). Local-disk npm ci is
    # ~2-4m + ~1-3m for the tarball write; headroom covers load spikes.
    timeout: 30m

  - name: typecheck
    image: node:22-bookworm
    needs: [install]
    steps:
      - name: tsc --noEmit
        run: |
          set -e
          mkdir -p /build && tar xf /workspace/api-deps.tar -C /build
          cd /build/api
          npx tsc --noEmit
    # Untar of ~940MB (~1m) + tsc (~1-2m); bump from 5m after the
    # materialization change so the untar never dominates the budget.
    timeout: 10m

  - name: lint
    image: node:22-bookworm
    needs: [typecheck]
    steps:
      # Zero-warning gate. Baseline history: 3,744 was set from a stale audit
      # and was already RED by +15 when the first run executed (3,759 after
      # the Oct-2 perf pass). 2026-10-03: route/lib test files typed via the
      # bodyAs<T>() pattern (43 files), then every non-globe source file
      # (map/lib layers, route handlers, studio, shared lib, pages):
      # 3,759 -> 2,690 -> 1,890. 2026-10-06: the entire app/globe surface was
      # typed against the ambient cesium-types.d.ts declarations — all 22
      # layer modules, tools suite, widgets, HudOverlays, the E2E specs and
      # page.tsx itself — reaching 0 warnings / 0 errors; the count guard
      # became a hard --max-warnings=0 gate. Any new warning is a regression.
      - name: eslint — zero warnings, zero errors
        run: |
          set -e
          mkdir -p /build && tar xf /workspace/api-deps.tar -C /build
          cd /build/api
          # "." not "src/": next.config.ts and other root-level TS also gate.
          npx eslint . --max-warnings=0 > /tmp/lint.log 2>&1 || {
            tail -60 /tmp/lint.log; exit 1;
          }
          echo "eslint: 0 problems (globe typed to zero 2026-10-06)"
    timeout: 10m

  - name: spec-check
    image: node:22-bookworm
    needs: [lint]
    steps:
      - name: openapi spec is current
        run: |
          set -e
          mkdir -p /build && tar xf /workspace/api-deps.tar -C /build
          cd /build/api
          npm run openapi:check
    timeout: 5m

  - name: unit-test
    image: node:22-bookworm
    needs: [spec-check]
    steps:
      # Two in-command retries: worker-start timeouts under host load are the
      # dominant failure mode (run 092b056e burned both attempts at load
      # ~110). isolate:false would remove the 99 worker spawns but leaks
      # module state across files (see the 10-01 cache-key decoupling bug),
      # so isolation stays on and retries absorb the flake instead.
      #
      # 2026-10-10 (run 395b1d31): the first failing vitest run exposed a
      # silent-retry-defeat bug — under `set -e`, the bare `npx vitest ...`
      # aborted the script at its own line on failure, so `code=$?` and both
      # retries NEVER ran and the job died with zero log output (everything
      # was redirected into the container-local /tmp). The `|| code=$?`
      # form hands the exit status to the retry logic instead.
      - name: vitest (two in-command retries + completeness guard)
        run: |
          set -e
          mkdir -p /build && tar xf /workspace/api-deps.tar -C /build
          cd /build/api
          code=0
          npx vitest run --maxWorkers=2 --reporter=dot > /tmp/vitest1.log 2>&1 || code=$?
          log=/tmp/vitest1.log
          if [ "$code" -ne 0 ]; then
            echo "first attempt failed (exit $code) — retrying (NAS flake)"
            tail -25 /tmp/vitest1.log
            if npx vitest run --maxWorkers=2 --reporter=dot > /tmp/vitest2.log 2>&1; then
              log=/tmp/vitest2.log
            else
              echo "second attempt failed — one more retry"
              tail -25 /tmp/vitest2.log
              npx vitest run --maxWorkers=2 --reporter=dot > /tmp/vitest3.log 2>&1 || {
                echo "all three attempts failed:"; tail -40 /tmp/vitest3.log; exit 1;
              }
              log=/tmp/vitest3.log
            fi
            echo "retry succeeded (flaky, absorbed)"
          fi
          # Worker-start failures DROP files and exit non-zero, so a green
          # exit should mean a complete run — assert it. Assert the
          # PARENTHESIZED totals (environment-independent): with the local
          # data/ mirror present the ozt2-real-tiles cross-check runs
          # (2026-10-08: 115 files / 1704 passed + 5 skipped), on CI runners
          # it skips (114+1 files / 1696+13 tests) — totals equal either way
          # (the real-tiles tests land in `skipped` on CI, `passed` locally).
          # Update BOTH numbers when the suite grows (fail-loud beats
          # fail-silent). Ratchet history: 107/1524 (2026-10-05) went stale
          # when excellence-plan waves 5-8 added suites without updating the
          # guard — the next CI run would have failed COUNT DRIFT. 115/1709
          # set 2026-10-09 (v0.9.3); 115/1718 on 2026-10-10 (+9 SGP4 worker
          # tests in worker-utils.test.ts, cycle VI phase C); 117/1731 on
          # 2026-10-10 (+13 cycle VI phase D: terrain-sampler.test.ts 6,
          # hydro-params.test.ts 7).
          clean=$(sed 's/\x1b\[[0-9;]*m//g' "$log")
          files=$(echo "$clean" | grep -oE 'Test Files +[0-9]+ passed.*\([0-9]+\)' | grep -oE '\([0-9]+\)' | tr -d '()')
          tests=$(echo "$clean" | grep -oE 'Tests +[0-9]+ passed.*\([0-9]+\)' | grep -oE '\([0-9]+\)' | tr -d '()')
          echo "test files in passing run: ${files:-UNKNOWN}; tests: ${tests:-UNKNOWN}"
          [ "${files:-0}" -eq 117 ] || {
            echo "INCOMPLETE: passing run covered ${files:-?}/117 files"; exit 1;
          }
          [ "${tests:-0}" -eq 1731 ] || {
            echo "COUNT DRIFT: ${tests:-?} total, baseline 1731 — update the guard or fix the suite"; exit 1;
          }
          tail -8 "$log"
    # Full suite is ~6 min locally, but load spikes on this shared NAS have
    # stretched sibling suites >4x — leave headroom for retry + spike.
    timeout: 30m

  - name: mcp-server
    image: node:22-bookworm
    needs: [unit-test]
    steps:
      # The stdio MCP server package gets the same gates as api/: strict
      # typecheck, typed eslint (0 warnings — the unsafe-family runs at
      # error there), and its contract tests. Its deps are installed
      # container-locally (its node_modules never touch the bridge either);
      # no dependency on the api/ tarball.
      - name: typecheck + lint + contract tests
        run: |
          set -e
          mkdir -p /build
          tar cf - -C /workspace mcp-server | tar xf - -C /build
          cd /build/mcp-server
          npm ci > /tmp/mcp-install.log 2>&1 || { tail -30 /tmp/mcp-install.log; exit 1; }
          npm run typecheck || exit 1
          npm run lint || exit 1
          npm test > /tmp/mcp-test.log 2>&1 || { tail -30 /tmp/mcp-test.log; exit 1; }
          tail -6 /tmp/mcp-test.log
    timeout: 20m

  - name: bundle-budget
    image: node:22-bookworm
    needs: [mcp-server]
    steps:
      # Perf tripwire (docs/planning/PERFORMANCE_PLAN_2026-10-02.md item 5):
      # rebuilds the production bundle and compares tracked chunk totals +
      # structural invariants (self-hosted font, CDN preloads, flip-card
      # marker) against api/perf-budget-baseline.json. Deliberate bundle
      # moves re-baseline with `node scripts/perf-budget.mjs --update` —
      # say so in the commit body. Build artifacts stay container-local —
      # nothing downstream consumes them.
      - name: pages:build + perf-budget check
        run: |
          set -e
          mkdir -p /build && tar xf /workspace/api-deps.tar -C /build
          cd /build/api
          npm run pages:build > /tmp/budget-build.log 2>&1 || { tail -30 /tmp/budget-build.log; exit 1; }
          node scripts/perf-budget.mjs
    # Run 779f0f61: pages:build timed out at 15m with an empty step log —
    # the same host-load class as the install failures (next build under
    # load 100+ stretched siblings >4x). 30m matches install's headroom.
    timeout: 30m
