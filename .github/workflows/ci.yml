name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e .[all,dev]

      - name: Pip audit
        run: pip audit || true

      - name: Ruff check
        run: ruff check openzenith/

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e .[all,dev]

      - name: Pytest with coverage
        run: python3 -m pytest openzenith/tests/ --cov=openzenith --cov-report=term-missing

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: [clippy]

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: core

      - name: Test
        run: cargo test --all-targets
        working-directory: core

  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Audit
        working-directory: api
        run: npm audit --audit-level=high || true

  api-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Type check
        working-directory: api
        run: npx tsc --noEmit

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Test with coverage
        working-directory: api
        run: npm run test:coverage

  deploy:
    needs: [python-lint, python-test, rust-test, api-lint, api-typecheck, api-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build for Cloudflare Pages
        working-directory: api
        run: npm run pages:build

      - name: Verify Pages artifact routes
        run: node scripts/verify_pages_artifact.mjs

      - name: Deploy to Cloudflare Pages
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .vercel/output/static --project-name=openzenith --branch=main --no-bundle --commit-hash="${{ github.sha }}" --commit-message="${{ github.sha }}"

      - name: Verify production deployment provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify_pages_deployment.mjs

      - name: Smoke-test deployed API
        env:
          BASE_URL: https://openzenith.pages.dev
        run: node scripts/smoke_public_api.mjs

      - name: Smoke-test custom domain API
        env:
          BASE_URL: https://openzenith.cyopsys.com
        run: node scripts/smoke_public_api.mjs
