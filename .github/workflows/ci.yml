# GitHub mirror validation — NON-AUTHORITATIVE.
# GitForge (http://localhost:42782/bigdata-ci/OpenZenith.git) is the primary
# CI/CD platform; this workflow is a best-effort mirror check. It must never
# deploy: the deploy path is scripts/ship.sh from a checkout (build ->
# bundle-marker -> deploy -> prod E2E), run by the maintainer.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .[all,dev]

      - name: Pip audit
        run: pip audit || false

      - name: Ruff check
        run: ruff check openzenith/

      # Same lint surface as the maintainer's local gate (project CLAUDE.md):
      # strict mypy bundle and the interrogate docstring floor (pyproject
      # [tool.interrogate] fail-under 99). GitForge (primary) cannot carry
      # these — no python image on the runner — so the mirror is where the
      # cloud check lives.
      - name: Mypy (strict)
        run: mypy openzenith/

      - name: Docstring coverage
        run: interrogate -c pyproject.toml openzenith/

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .[all,dev]

      - name: Pytest with coverage
        run: python3 -m pytest openzenith/tests/ --cov=openzenith --cov-fail-under=99 --cov-report=term-missing

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: core/target
          key: rust-${{ runner.os }}-${{ hashFiles('core/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.80
        with:
          components: [clippy]

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: core

      - name: Test
        run: cargo test --all-targets
        working-directory: core

  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Audit
        working-directory: api
        run: npm audit --audit-level=high || false

  api-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Type check
        working-directory: api
        run: npx tsc --noEmit

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Test with coverage
        working-directory: api
        run: npm run test:coverage
