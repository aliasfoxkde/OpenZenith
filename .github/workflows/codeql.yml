# GitHub mirror validation — NON-AUTHORITATIVE.
# GitForge (http://localhost:42782/bigdata-ci/OpenZenith.git) is the primary
# CI/CD platform; this workflow is a best-effort mirror check. It must never
# deploy: the deploy path is scripts/ship.sh from a checkout (build ->
# bundle-marker -> deploy -> prod E2E), run by the maintainer.

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ["javascript", "typescript", "python"]
      - uses: github/codeql-action/analyze@v3
