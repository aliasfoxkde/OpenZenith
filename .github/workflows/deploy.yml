name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache: npm  # Disabled due to CI caching issue
          # cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm install  # Using install since package-lock.json is gitignored

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Format check
        working-directory: api
        run: npm run format:check

      - name: Type check
        working-directory: api
        run: npx tsc --noEmit

      - name: Test
        working-directory: api
        run: npm run test

      - name: Build Next.js
        working-directory: api
        run: npm run build

      - name: Build for Cloudflare Pages
        working-directory: api
        run: npm run pages:build

      - name: Verify Pages artifact routes
        run: node scripts/verify_pages_artifact.mjs

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache: npm  # Disabled due to CI caching issue
          # cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm install  # Using install since package-lock.json is gitignored

      - name: Build for Cloudflare Pages
        working-directory: api
        run: npm run pages:build

      - name: Verify Pages artifact routes
        run: node scripts/verify_pages_artifact.mjs

      - name: Deploy to Cloudflare Pages
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .vercel/output/static --project-name=openzenith --branch=main --no-bundle --commit-hash="${{ github.sha }}" --commit-message="${{ github.sha }}"

      - name: Verify production deployment provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify_pages_deployment.mjs

      - name: Smoke-test deployed API
        env:
          BASE_URL: https://openzenith.pages.dev
        run: node scripts/smoke_public_api.mjs

      - name: Smoke-test custom domain API
        env:
          BASE_URL: https://openzenith.cyopsys.com
        run: node scripts/smoke_public_api.mjs
