name: Deploy

# Only run when CI completes on main — avoids duplicate deploys on the same push
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build for Cloudflare Pages
        working-directory: api
        run: npm run pages:build

      - name: Verify Pages artifact routes
        run: node scripts/verify_pages_artifact.mjs

      - name: Deploy to Cloudflare Pages
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .vercel/output/static --project-name=openzenith --branch=main --no-bundle --commit-hash="${{ github.sha }}" --commit-message="${{ github.sha }}"

      - name: Verify production deployment provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify_pages_deployment.mjs

      - name: Smoke-test deployed API
        env:
          BASE_URL: https://openzenith.pages.dev
        run: node scripts/smoke_public_api.mjs

      - name: Smoke-test custom domain API
        env:
          BASE_URL: https://openzenith.cyopsys.com
        run: node scripts/smoke_public_api.mjs
