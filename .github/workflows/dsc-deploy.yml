name: Temporary DSC Cloudflare Pages deploy
on:
  workflow_dispatch:
    inputs:
      dsc_sha:
        description: Exact DSC commit represented by the bundled production build
        required: true
        type: string
        default: 87e4be3f961aa41498ac5e6e36cd1fe39a9afe2b
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm artifact commit
        run: test "${{ inputs.dsc_sha }}" = "87e4be3f961aa41498ac5e6e36cd1fe39a9afe2b"
      - name: Deploy DSC to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.166.0 pages deploy dsc-dist --project-name dsc-commerce-storefront --branch main
