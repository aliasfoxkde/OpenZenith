# GitHub mirror validation — NON-AUTHORITATIVE.
# GitForge (http://localhost:42782/bigdata-ci/OpenZenith.git) is the primary
# CI/CD platform; this workflow is a best-effort mirror check. It must never
# deploy anything: the site deploy path is scripts/ship.sh from a checkout
# (build -> bundle-marker -> deploy -> prod E2E), run by the maintainer, and
# the PyPI publish path is maintainer-gated too — see docs/PUBLISHING.md.
# This job therefore VALIDATES the sdist/wheel build on version tags but
# never uploads: a billing-blocked Actions account must not hold a trusted
# publisher, and an unattended publish would outrank the local gates.

name: Validate Python SDK build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  validate-build:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Install SDK with all extras
        run: pip install -e .[all,dev]

      - name: Lint
        run: ruff check openzenith/

      - name: Test
        run: python3 -m pytest openzenith/tests/ -q

      - name: Pip audit
        run: pip audit || true

      - name: Build package
        run: python -m build

      - name: Record artifacts (validation only — never uploaded)
        run: |
          ls -la dist/
          echo "Publishing is maintainer-gated: docs/PUBLISHING.md"
