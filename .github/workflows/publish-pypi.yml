# GitHub mirror validation — NON-AUTHORITATIVE.
# GitForge (http://localhost:42782/bigdata-ci/OpenZenith.git) is the primary
# CI/CD platform; this workflow is a best-effort mirror check. It must never
# deploy: the deploy path is scripts/ship.sh from a checkout (build ->
# bundle-marker -> deploy -> prod E2E), run by the maintainer.

name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Install SDK with all extras
        run: pip install -e .[all,dev]

      - name: Lint
        run: ruff check openzenith/

      - name: Test
        run: python3 -m pytest openzenith/tests/ -q

      - name: Pip audit
        run: pip audit || true

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
