name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust CLI binary
        run: cargo build --release

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg

      - name: Create checksums
        run: |
          sha256sum target/release/openzenith_core_cli > SHA256SUMS.txt
          echo "openzenith_core_wasm.tar.gz" >> SHA256SUMS.txt
          tar -czf openzenith_core_wasm.tar.gz -C pkg .
          sha256sum openzenith_core_wasm.tar.gz >> SHA256SUMS.txt

      - name: Package Linux binary
        run: tar -czf openzenith_core_cli-linux-x86_64.tar.gz -C target/release openzenith_core_cli

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openzenith_core_cli-linux-x86_64.tar.gz
            openzenith_core_wasm.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    needs: build-assets
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: cd openzenith && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
