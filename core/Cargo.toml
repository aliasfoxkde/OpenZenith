[package]
name = "openzenith-core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust core for OpenZenith terrain analysis"
license = "MIT"
repository = "https://github.com/aliasfox/openzenith"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# A terrain-analysis library must not panic on caller input: every failure
# mode is a Result (or a documented error JSON for the CLI/WASM shells).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Deliberately NOT enabled: arithmetic_side_effects / cast_possible_truncation
# / cast_sign_loss measured 103 hits, all in D8/viewshed neighbor indexing
# where offsets are -1..1 and indices are bounded by the grid dimensions by
# construction. Enforcing them would add 100+ unreachable assertions to hot
# loops. Revisit if untrusted indices ever reach these functions directly.

[lib]
name = "openzenith_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "openzenith_core_cli"
path = "src/main.rs"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies.wasm-bindgen]
version = "0.2"
features = ["serde-serialize"]
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
