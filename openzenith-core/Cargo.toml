[package]
name = "openzenith-core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust core for OpenZenith terrain analysis"
license = "MIT"
repository = "https://github.com/aliasfox/openzenith"

[lib]
name = "openzenith_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "openzenith_core_cli"
path = "src/main.rs"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies.wasm-bindgen]
version = "0.2"
features = ["serde-serialize"]
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
