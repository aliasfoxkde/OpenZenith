# Measured 92.84% (12,728 stmts, 911 miss), 991 passed, 0 failed.
#
# Raised to 93 (2026-09-23) with the lazy-export surface and CLI pipelines —
# __init__ 36→100% (test_lazy_exports.py: all 142 lazy __getattr__ names
# resolve, each pinned in __all__, unknown attrs raise; also fixed API drift —
