[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openzenith"
dynamic = ["version"]
description = "Global elevation data tools — query, download, analyze, simulate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenZenith", email = "dev@openzenith.cyopsys.com" }]
keywords = ["elevation", "dem", "srtm", "terrain", "hydrology", "gis", "topography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
    "pyshp>=2.3",
    "requests>=2.28",
]

[project.optional-dependencies]
compression = [
    "zstandard>=0.21",
    "brotli>=1.0",
]
download = [
    "huggingface_hub>=0.16",
]
analysis = [
    "aiohttp>=3.8",
    "numba>=0.56",
    "rasterio>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "hatchling",
]
all = [
    "openzenith[compression,download,analysis,dev]",
]

[project.scripts]
openzenith = "openzenith.cli:main"

[project.urls]
Homepage = "https://openzenith.cyopsys.com"
Documentation = "https://github.com/aliasfoxkde/OpenZenith"
Repository = "https://github.com/aliasfoxkde/OpenZenith"

[tool.hatch.build.targets.wheel]
packages = ["openzenith"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Strict set: pycodestyle/pyflakes, isort, bugbear, flake8-comprehensions,
# pyupgrade, flake8-simplify, ruff-specific, flake8-use-pathlib, pydocstyle.
# D203/D213 excluded as ruff recommends (incompatible with D211/D212).
extend-select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PTH", "D",
]
ignore = ["D203", "D213"]
# × (U+00D7) and − (U+2212) are intentional math symbols in dimension strings
# like "3600×1800" and elevation deltas, not confusable typos.
allowed-confusables = ["×", "−"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# Test names document themselves; enforcing docstrings there is noise.
"openzenith/tests/*" = ["D101", "D102", "D103", "D107"]

[tool.pytest.ini_options]
testpaths = ["openzenith/tests"]
addopts = "-m \"not integration\" --cov=openzenith --cov-report=term-missing --cov-fail-under=97"
markers = [
    "integration: marks tests that require network access",
]
# Coverage floor ratchets upward only. Measured baseline 2026-09-22 is 81.95%
# (10,867 stmts, 1,961 miss) — floor set to 81 because fail-under is a strict
# >= check. Raised to 82 (terrain split re-measured 82.08%), then 83 after
# raster (36→100%) and vector (55→93%) gained dedicated tests (83.23%),
# then 85 the same day once dedicated suites landed for the three weakest
# terrain modules — flow_metrics 54→99% (test_flow_metrics.py: STI, flow
# truncation, sink depth, DEM cleaning, Hack-integral edge regressions),
# viewshed 57→78% (test_viewshed.py: occlusion, horizon, fetch, directional
# relief — per-function azimuth conventions pinned; the numba JIT kernel is
# an unreachable optional accelerator without numba installed), and
# terrain/indices 66→97% (test_indices.py: relative elevation, relief ratio,
# threshold helpers, edge contamination). Measured 85.39% (11,469 stmts,
# 1,676 miss), 807 passed. Weakest remaining: terrain/profiles 70%,
# terrain/gradients 72%, viz 67%, terrain/filters 84%.
#
# Raised to 87 (2026-09-22) with dedicated suites for those four modules —
# profiles 70→95% (test_profiles.py: path/diagonal distances, hillslope walk
# pinned to its actual downstream trace, flow_length both directions incl.
# nodata skip), gradients 72→100% (test_gradients.py: gaussian/horizontal
# curvature, convergence/edge/downslope indices, self-consistency + nodata
# fills), filters 84→99% (test_filters.py: adaptive Lee filter incl. the
# constant-terrain k=0 guard, morphology, sieve diagonal merge, the
# feature_preserving_smooth pad-bug regression), viz 67→100% (test_viz.py:
# matplotlib ImportError guards + show paths, PNG RGB mode, and GLB decode
# regressions — installing trimesh exposed four latent runtime bugs in
