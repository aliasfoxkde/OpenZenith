# defensive D8 guards — probe-verified unreachable (d8_flow_direction never
# cycles and never points off-grid across 500+ random DEMs).
#
# Raised to 90 (2026-09-23) with dedicated suites for the four weakest I/O
# modules — fuse 44→99% (test_fuse.py: FusedDEM srtm/gebco blending, nodata
# and merge-error propagation, gebco quad via real rasterio tiff + PIL
# I;16 fallback, sync query + async query_to_thread, load_fused_tile tile
