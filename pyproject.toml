[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openzenith"
dynamic = ["version"]
description = "Global elevation data tools — query, download, analyze, simulate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenZenith", email = "dev@openzenith.cyopsys.com" }]
keywords = ["elevation", "dem", "srtm", "terrain", "hydrology", "gis", "topography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
    "pyshp>=2.3",
    "requests>=2.28",
]

[project.optional-dependencies]
compression = [
    "zstandard>=0.21",
    "brotli>=1.0",
]
download = [
    "huggingface_hub>=0.16",
]
analysis = [
    "aiohttp>=3.8",
    "numba>=0.56",
    "rasterio>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "hatchling",
]
all = [
    "openzenith[compression,download,analysis,dev]",
]

[project.scripts]
openzenith = "openzenith.cli:main"

[project.urls]
Homepage = "https://openzenith.cyopsys.com"
Documentation = "https://github.com/aliasfoxkde/OpenZenith"
Repository = "https://github.com/aliasfoxkde/OpenZenith"

[tool.hatch.build.targets.wheel]
packages = ["openzenith"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Strict set: pycodestyle/pyflakes, isort, bugbear, flake8-comprehensions,
# pyupgrade, flake8-simplify, ruff-specific, flake8-use-pathlib, pydocstyle.
# D203/D213 excluded as ruff recommends (incompatible with D211/D212).
extend-select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PTH", "D",
]
ignore = ["D203", "D213"]
# × (U+00D7) and − (U+2212) are intentional math symbols in dimension strings
# like "3600×1800" and elevation deltas, not confusable typos.
allowed-confusables = ["×", "−"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# Test names document themselves; enforcing docstrings there is noise.
"openzenith/tests/*" = ["D101", "D102", "D103", "D107"]

[tool.pytest.ini_options]
testpaths = ["openzenith/tests"]
addopts = "-m \"not integration\" --cov=openzenith --cov-report=term-missing --cov-fail-under=81"
markers = [
    "integration: marks tests that require network access",
]
# Coverage floor ratchets upward only. Measured baseline 2026-09-22 is 81.95%
# (10,867 stmts, 1,961 miss) — floor set to 81 because fail-under is a strict
# >= check. Weakest modules: fuse 44%, converter 48%, async_client 55%,
# vector 55%, elevation 58%, backends/ozt2 59%. Next ratchet: 82, then 85.
# Raise --cov-fail-under only together with tests that cover the delta.
