[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openzenith"
version = "0.5.1"
description = "Global elevation data tools — query, download, analyze, simulate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenZenith", email = "dev@openzenith.cyopsys.com" }]
keywords = ["elevation", "dem", "srtm", "terrain", "hydrology", "gis", "topography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
    "requests>=2.28",
]

[project.optional-dependencies]
compression = [
    "zstandard>=0.21",
    "brotli>=1.0",
]
download = [
    "huggingface_hub>=0.16",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "hatchling",
]
all = [
    "openzenith[compression,download,dev]",
]

[project.scripts]
openzenith = "openzenith.cli:main"

[project.scripts]
openzenith = "openzenith.cli:main"

[project.urls]
Homepage = "https://openzenith.cyopsys.com"
Documentation = "https://github.com/aliasfoxkde/OpenZenith"
Repository = "https://github.com/aliasfoxkde/OpenZenith"

[tool.hatch.build.targets.wheel]
packages = ["openzenith"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["openzenith/tests"]
